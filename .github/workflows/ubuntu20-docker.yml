name: ubuntu20-docker-build

on:
  push:
    branches:
      - 'main'
    paths:
      - 'ubuntu-20-dev/**'
      - '.github/workflows/ubuntu20-docker.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'ubuntu-20-dev/**'
      - '.github/workflows/ubuntu20-docker.yml'
  workflow_dispatch:

jobs:

  ubuntu-20-dev:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - uses: mr-smithers-excellent/docker-build-push@v7
        name: Build & push Docker image
        with:
          image: meta-flutter/ubuntu-20-dev
          tags: main
          registry: ghcr.io
          dockerfile: ubuntu-20-dev/Dockerfile
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          pushImage: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
