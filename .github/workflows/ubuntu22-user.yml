name: ubuntu22-user-docker-build

on:
  push:
    branches:
      - 'main'
    paths:
      - 'ubuntu-22-user/**'
      - '.github/workflows/ubuntu22-user.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'ubuntu-22-user/**'
      - '.github/workflows/ubuntu22-user.yml'
  workflow_dispatch:

jobs:

  ubuntu-22-user:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - uses: mr-smithers-excellent/docker-build-push@v7
        name: Build & push Docker image
        with:
          image: meta-flutter/ubuntu-22-user
          tags: main
          registry: ghcr.io
          dockerfile: ubuntu-22-user/Dockerfile
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          pushImage: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
